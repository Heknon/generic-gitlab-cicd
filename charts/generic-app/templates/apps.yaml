{{- range $key, $app := .Values.apps }}
{{- if $app.enabled }}
{{- $name := printf "%s-%s-%s" ($.Release.Name | trunc 28 | trimSuffix "-") ($.Release.Name | sha256sum | trunc 8) $key }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $key }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  replicas: {{ $app.replicas }}
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $key }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        {{- mergeOverwrite (deepCopy (default dict $app.podLabels)) (dict "app.kubernetes.io/name" $key "app.kubernetes.io/instance" $.Release.Name) | toYaml | nindent 8 }}
      annotations:
        {{- mergeOverwrite (deepCopy (default dict $app.podAnnotations)) (dict "checksum/config" (toJson $app.config | sha256sum)) | toYaml | nindent 8 }}
    spec:
      {{- if hasKey $app "automountServiceAccountToken" }}
      automountServiceAccountToken: {{ $app.automountServiceAccountToken }}
      {{- end }}
      {{- with $app.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $app.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $key }}
          image: {{ printf "%s:%s" $app.image.repository $app.image.tag | quote }}
          imagePullPolicy: IfNotPresent
          {{- with $app.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if hasKey $app "ports" }}
          {{- with $app.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- else if $app.service.enabled }}
          ports:
            - name: http
              containerPort: {{ default 8080 $app.service.targetPort }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $name }}
            {{- range $app.secretRefs }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- with $app.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $app.volumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with $app.volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  {{- toYaml $app.config | nindent 2 }}
{{- if $app.service.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  {{- with $app.service.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with $app.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $key }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    {{- if hasKey $app.service "ports" }}
    {{- toYaml $app.service.ports | nindent 4 }}
    {{- else }}
    - name: http
      port: {{ default 80 $app.service.port }}
      targetPort: http
    {{- end }}
{{- $route := default dict $app.route }}
{{- if $route.enabled }}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  {{- with $route.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $route.host }}
  host: {{ . | quote }}
  {{- end }}
  {{- with $route.path }}
  path: {{ . | quote }}
  {{- end }}
  to:
    kind: Service
    name: {{ $name }}
  port:
    targetPort: {{ default "http" $route.targetPort | toYaml }}
  {{- with $route.wildcardPolicy }}
  wildcardPolicy: {{ . | quote }}
  {{- end }}
  {{- with $route.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
