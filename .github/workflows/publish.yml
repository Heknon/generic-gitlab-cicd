name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  build:
    name: Test and build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - name: Install build and test tools
        run: python -m pip install . build twine uv setuptools
      - name: Check release version
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          if os.environ['RELEASE_TAG'] not in {version, 'v' + version}:
              raise SystemExit(f'Release tag must match package version {version} (optional v prefix).')
          PY
      - name: Check generated references
        run: |
          python scripts/sync_embedded.py --check
          python scripts/sync_authoring_skill.py --check
      - name: Install local pipeline test tool
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run tests
        run: |
          helm version --short
          helm lint charts/generic-app -f examples/helm-values.yaml --strict
          python -m unittest discover -s tests -v
          python tests/integration_uv.py
          npm run test:ci-local
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions with PyPI Trusted Publishing
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/generic-gitlab-cicd/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
