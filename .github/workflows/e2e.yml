name: GitLab E2E
# Deliberate runs only. Add the PR label to exercise an unmerged harness;
# remove it after obtaining evidence to avoid repeating expensive boots.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'One scenario, or all'
        type: choice
        options: [all, handoff, failed-gate, matrix, selection, merge-request, manual-gate]
        default: all
  pull_request:
    types: [labeled, synchronize]
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  gitlab:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'run-gitlab-e2e'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install .
      - name: Boot isolated GitLab and execute fixtures
        env:
          SCENARIO: ${{ inputs.scenario || 'all' }}
        run: |
          if [ "$SCENARIO" = all ]; then
            python tools/testing/e2e.py
          else
            python tools/testing/e2e.py --scenario "$SCENARIO"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitlab-e2e-evidence
          path: .test-results/e2e/
          if-no-files-found: error
      - name: Cleanup after interruption
        if: always()
        run: |
          docker ps -aq --filter label=com.generic-ci.e2e=true | xargs -r docker rm -fv
          docker volume ls -q --filter label=com.generic-ci.e2e=true | xargs -r docker volume rm
