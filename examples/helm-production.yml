include:
- component: $CI_SERVER_FQDN/platform/ci-components/workflow@1.0.0
- component: $CI_SERVER_FQDN/platform/ci-components/container-build@1.0.0
  inputs:
    name: api-container
    destination: artifactory.example.internal/docker-local/api:$CI_COMMIT_SHA
    push: true
    metadata-file: api-build-metadata.json
    rules:
    - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
    - when: never
- component: $CI_SERVER_FQDN/platform/ci-components/helm-deploy@1.0.0
  inputs:
    name: production
    dependencies:
    - api-container
    url: https://api.example.internal
    values-file: deploy/values.yaml
    image-map-json: '[{"app":"api","repository":"artifactory.example.internal/docker-local/api","metadata":"api-build-metadata.json"}]'
- component: $CI_SERVER_FQDN/platform/ci-components/release@1.0.0
