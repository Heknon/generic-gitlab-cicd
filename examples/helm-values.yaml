imagePullSecrets:
- name: artifactory-pull
apps:
  api:
    enabled: true
    replicas: 2
    image:
      repository: artifactory.example.internal/docker-local/apps/api
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: []
    args: []
    config:
      APP_ENV: production
    secretRefs:
    - api-secrets
    env: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    readinessProbe:
      httpGet:
        path: /health/ready
        port: http
      initialDelaySeconds: 5
      periodSeconds: 5
    livenessProbe:
      httpGet:
        path: /health/live
        port: http
      initialDelaySeconds: 15
      periodSeconds: 10
    service:
      enabled: true
      port: 80
      targetPort: 8080
    ingress:
      enabled: true
      className: nginx
      host: api.example.internal
      tlsSecret: api-tls
      annotations: {}
  worker:
    enabled: true
    replicas: 2
    image:
      repository: artifactory.example.internal/docker-local/apps/worker
      digest: sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    command: []
    args: []
    config:
      APP_ENV: production
    secretRefs:
    - worker-secrets
    env: []
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 512Mi
    readinessProbe:
      exec:
        command:
        - /app/healthcheck
      periodSeconds: 10
    service:
      enabled: false
      port: 80
      targetPort: 8080
    ingress:
      enabled: false
      className: nginx
      host: api.example.internal
      tlsSecret: api-tls
      annotations: {}
