spec:
  inputs:
    name:
      type: string
      description: Unique job name, including the service name.
    image:
      type: string
      description: Container image; pin an approved digest for production.
      default: $PYTHON_CI_IMAGE
    directory:
      type: string
      description: Working directory relative to the consumer repository root.
      default: .
    setup:
      type: array
      description: Commands run after changing directory. Use locked dependencies.
      default: []
    rules:
      type: array
      description: Protected release tags only by default; manual blocking job.
      default:
      - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
        when: manual
      - when: never
    runner-tags:
      type: array
      description: Runner selection tags.
      default: []
    timeout:
      type: string
      description: Job timeout.
      default: 30m
    stage:
      type: string
      description: Stage after build/verify.
      default: publish
    build-job:
      type: string
      description: Job providing distributions; must exist on the same release tag.
    distribution-path:
      type: string
      description: Distribution artifact directory relative to repository root.
    repository-url:
      type: string
      description: PyPI, TestPyPI, or private upload endpoint.
      default: $PYPI_UPLOAD_URL
    auth:
      type: string
      description: token uses TWINE_USERNAME/TWINE_PASSWORD; oidc uses trusted publishing.
      default: token
      options:
      - token
      - oidc
      - gitlab
    audience:
      type: string
      description: OIDC audience; use testpypi for TestPyPI.
      default: pypi
    environment:
      type: string
      description: Protect this GitLab environment and scope credentials to it.
      default: pypi
---
$[[ inputs.name ]]:
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  timeout: $[[ inputs.timeout ]]
  interruptible: false
  retry: 0
  variables:
    COMPONENT_DIRECTORY: $[[ inputs.directory ]]
    COMPONENT_AUTH: $[[ inputs.auth ]]
    COMPONENT_DIST: $[[ inputs.distribution-path ]]
    COMPONENT_REPOSITORY_URL: $[[ inputs.repository-url ]]
  before_script:
  - cd "$CI_PROJECT_DIR/$COMPONENT_DIRECTORY"
  - $[[ inputs.setup ]]
  rules: $[[ inputs.rules ]]
  stage: $[[ inputs.stage ]]
  allow_failure: false
  dependencies:
  - $[[ inputs.build-job ]]
  resource_group: publish-$[[ inputs.name ]]
  environment:
    name: $[[ inputs.environment ]]
    deployment_tier: other
  id_tokens:
    PYPI_ID_TOKEN:
      aud: $[[ inputs.audience ]]
  script:
  - test -z "${CI_DEPENDENCY_REPO:-}${CI_DEPENDENCY_REF:-}${CI_DEPENDENCY_PACKAGE:-}"
    && test "${CI_DEPENDENCY_OVERRIDES:-[]}" = '[]' || { echo 'Remove candidate dependency
    overrides before production publishing/deployment'; exit 1; }
  - "set -eu\ncase \"$COMPONENT_AUTH\" in\n  token) : \"${TWINE_PASSWORD:?Set an environment-scoped\
    \ protected masked token}\"\n         export TWINE_USERNAME=\"${TWINE_USERNAME:-__token__}\"\
    \ ;;\n  oidc) unset TWINE_USERNAME TWINE_PASSWORD ;;\n  gitlab) export TWINE_USERNAME=gitlab-ci-token\
    \ TWINE_PASSWORD=\"$CI_JOB_TOKEN\" ;;\nesac\nexport TWINE_REPOSITORY_URL=\"$COMPONENT_REPOSITORY_URL\"\
    \nset -- \"$CI_PROJECT_DIR/$COMPONENT_DIST\"/*.whl \"$CI_PROJECT_DIR/$COMPONENT_DIST\"\
    /*.tar.gz\nfor file do test -f \"$file\" || { echo 'Expected both wheel and sdist\
    \ artifacts'; exit 1; }; done\npython -m twine check \"$@\"\npython -m twine upload\
    \ --non-interactive \"$@\""
