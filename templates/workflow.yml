spec:
  inputs:
    stages:
      type: array
      description: Pipeline stages; include exactly once.
      default:
      - lint
      - test
      - build
      - verify
      - publish
      - deploy
      - release
---
stages: $[[ inputs.stages ]]
workflow:
  auto_cancel:
    on_new_commit: conservative
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_TAG
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
    when: never
  - if: $CI_COMMIT_BRANCH
  - when: never
