spec:
  inputs:
    name:
      type: string
      description: Unique job name, including the service name.
    image:
      type: string
      description: Python + Git + packaging runtime.
      default: $PYTHON_CI_IMAGE
    directory:
      type: string
      description: Working directory relative to the consumer repository root.
      default: .
    setup:
      type: array
      description: Commands run after changing directory. Use locked dependencies.
      default: []
    rules:
      type: array
      description: GitLab job rules; final matching rule wins only by order (first match).
      default:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH
    runner-tags:
      type: array
      description: Runner selection tags.
      default: []
    timeout:
      type: string
      description: Job timeout.
      default: 30m
    pyproject:
      type: string
      description: Root-relative package manifest.
      default: pyproject.toml
    tag-prefix:
      type: string
      description: Use e.g. sdk-v for independent monorepo tags.
      default: v
    allow-new-package:
      type: boolean
      description: Allow manifest absent from target branch.
      default: false
---
$[[ inputs.name ]]:
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  timeout: $[[ inputs.timeout ]]
  interruptible: true
  retry:
    max: 1
    when:
    - runner_system_failure
    - stuck_or_timeout_failure
  variables:
    COMPONENT_DIRECTORY: $[[ inputs.directory ]]
    COMPONENT_PYPROJECT: $[[ inputs.pyproject ]]
    COMPONENT_TAG_PREFIX: $[[ inputs.tag-prefix ]]
    COMPONENT_ALLOW_NEW: enabled-$[[ inputs.allow-new-package ]]
  before_script:
  - cd "$CI_PROJECT_DIR"
  - $[[ inputs.setup ]]
  rules: $[[ inputs.rules ]]
  stage: lint
  dependencies: []
  script:
  - "python - <<'COMPONENT_PYTHON'\n\"\"\"Static PEP 621 versions: compare target branch and validate\
    \ release tags.\"\"\"\nimport os\nfrom pathlib import Path\nimport subprocess\nimport tomllib\nfrom\
    \ packaging.version import Version\n\n\ndef get_version(raw):\n    data = tomllib.loads(raw)\n   \
    \ project = data.get('project', {})\n    if 'version' in project.get('dynamic', []) or 'version' not\
    \ in project:\n        raise ValueError('Static project.version required; configure a custom check\
    \ for SCM/dynamic versions')\n    version = Version(project['version'])\n    if version.local:\n \
    \       raise ValueError('Local version suffixes are not supported for public releases')\n    return\
    \ version\n\n\ndef main():\n    path = Path(os.environ.get('COMPONENT_PYPROJECT','pyproject.toml'))\n\
    \    current = get_version(path.read_text())\n    tag = os.environ.get('CI_COMMIT_TAG','')\n    if\
    \ tag:\n        prefix = os.environ.get('COMPONENT_TAG_PREFIX','v')\n        if not tag.startswith(prefix)\
    \ or Version(tag[len(prefix):]) != current:\n            raise ValueError(f'Tag must match {prefix}{current}')\n\
    \        print(f'Tag matches package version {current}')\n        return\n    target = os.environ.get('CI_MERGE_REQUEST_TARGET_BRANCH_NAME')\
    \ or os.environ.get('CI_DEFAULT_BRANCH','main')\n    if os.environ.get('CI_COMMIT_BRANCH') == target:\n\
    \        print(f'Default branch version: {current}; bump enforcement occurs before merge')\n     \
    \   return\n    subprocess.run(['git','fetch','--no-tags','origin',f'+refs/heads/{target}:refs/ci/version-base'],check=True)\n\
    \    result = subprocess.run(['git','show',f'refs/ci/version-base:{path.as_posix()}'],text=True,capture_output=True)\n\
    \    if result.returncode:\n        if os.environ.get('COMPONENT_ALLOW_NEW') == 'enabled-true':\n\
    \            # Distinguish missing file from invalid fetch/object or other git failures.\n       \
    \     exists = subprocess.run(['git','cat-file','-e','refs/ci/version-base^{commit}'])\n         \
    \   listing = subprocess.check_output(['git','ls-tree','-r','--name-only','refs/ci/version-base','--',path.as_posix()],text=True)\n\
    \            if exists.returncode == 0 and not listing.strip():\n                print(f'New package\
    \ starts at {current}')\n                return\n        raise ValueError('Cannot read baseline package\
    \ version')\n    previous = get_version(result.stdout)\n    if current <= previous:\n        raise\
    \ ValueError(f'Bump project.version above {previous}; got {current}')\n    print(f'Version bump accepted:\
    \ {previous} -> {current}')\n\nif __name__ == '__main__':\n    main()\n\nCOMPONENT_PYTHON"
