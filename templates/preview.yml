spec:
  inputs:
    name:
      type: string
      description: Unique job name, including the service name.
    image:
      type: string
      description: Container image; pin an approved digest for production.
      default: $DEPLOY_CI_IMAGE
    directory:
      type: string
      description: Working directory relative to the consumer repository root.
      default: .
    setup:
      type: array
      description: Commands run after changing directory. Use locked dependencies.
      default: []
    runner-tags:
      type: array
      description: Runner selection tags.
      default: []
    timeout:
      type: string
      description: Job timeout.
      default: 30m
    stage:
      type: string
      description: Both start and stop use the same stage.
      default: deploy
    deploy-commands:
      type: array
      description: Create/update isolated preview, then health check.
    stop-commands:
      type: array
      description: Idempotent teardown; tools must be in the image, not repository
        scripts.
    dependencies:
      type: array
      description: Build artifact jobs for preview deployment only.
      default: []
    url:
      type: string
      description: Preview URL, may use CI_MERGE_REQUEST_IID.
    auto-stop-in:
      type: string
      description: Preview lifetime.
      default: 2 days
    stop-setup:
      type: array
      description: Teardown setup must work without a checkout or build artifacts.
      default: []
    change-paths:
      type: array
      description: Paths selecting both preview jobs; include shared dependencies.
      default:
      - '**/*'
    deploy-when:
      type: string
      description: Run previews manually or automatically.
      default: manual
      options:
      - manual
      - on_success
---
$[[ inputs.name ]]:
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  timeout: $[[ inputs.timeout ]]
  interruptible: false
  retry: 0
  variables:
    COMPONENT_DIRECTORY: $[[ inputs.directory ]]
  before_script:
  - cd "$CI_PROJECT_DIR/$COMPONENT_DIRECTORY"
  - $[[ inputs.setup ]]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID
      == $CI_PROJECT_ID
    changes: $[[ inputs.change-paths ]]
  - when: never
  stage: $[[ inputs.stage ]]
  allow_failure: true
  dependencies: $[[ inputs.dependencies ]]
  resource_group: review/$[[ inputs.name ]]/$CI_MERGE_REQUEST_IID
  environment:
    name: review/$[[ inputs.name ]]/$CI_MERGE_REQUEST_IID
    url: $[[ inputs.url ]]
    deployment_tier: development
    on_stop: $[[ inputs.name ]]-stop
    auto_stop_in: $[[ inputs.auto-stop-in ]]
  script: $[[ inputs.deploy-commands ]]
  when: $[[ inputs.deploy-when ]]
$[[ inputs.name ]]-stop:
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  timeout: $[[ inputs.timeout ]]
  interruptible: false
  retry: 0
  variables:
    COMPONENT_DIRECTORY: $[[ inputs.directory ]]
    GIT_STRATEGY: none
  before_script: $[[ inputs.stop-setup ]]
  rules:
  - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID
      == $CI_PROJECT_ID
    changes: $[[ inputs.change-paths ]]
  - when: never
  stage: $[[ inputs.stage ]]
  allow_failure: true
  dependencies: []
  resource_group: review/$[[ inputs.name ]]/$CI_MERGE_REQUEST_IID
  environment:
    name: review/$[[ inputs.name ]]/$CI_MERGE_REQUEST_IID
    action: stop
  script: $[[ inputs.stop-commands ]]
  when: manual
