spec:
  inputs:
    name:
      type: string
      description: Unique job name, including the service name.
    image:
      type: string
      description: Container image; pin an approved digest for production.
      default: $PYTHON_CI_IMAGE
    directory:
      type: string
      description: Working directory relative to the consumer repository root.
      default: .
    setup:
      type: array
      description: Commands run after changing directory. Use locked dependencies.
      default: []
    rules:
      type: array
      description: GitLab job rules; final matching rule wins only by order (first
        match).
      default:
      - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      - if: $CI_COMMIT_TAG
      - if: $CI_COMMIT_BRANCH
    runner-tags:
      type: array
      description: Runner selection tags.
      default: []
    timeout:
      type: string
      description: Job timeout.
      default: 30m
    output:
      type: string
      description: Dedicated build output directory relative to repository root; must
        not exist.
    build-command:
      type: string
      description: Build command; must create wheel and sdist in COMPONENT_OUTPUT.
      default: python -m build --outdir "$CI_PROJECT_DIR/$COMPONENT_OUTPUT"
    check-command:
      type: string
      description: Distribution metadata check.
      default: python -m twine check "$CI_PROJECT_DIR/$COMPONENT_OUTPUT"/*
    stage:
      type: string
      description: Stage after lint and test.
      default: build
---
$[[ inputs.name ]]:
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  timeout: $[[ inputs.timeout ]]
  interruptible: true
  retry:
    max: 1
    when:
    - runner_system_failure
    - stuck_or_timeout_failure
  variables:
    COMPONENT_DIRECTORY: $[[ inputs.directory ]]
    COMPONENT_OUTPUT: $[[ inputs.output ]]
  before_script:
  - cd "$CI_PROJECT_DIR/$COMPONENT_DIRECTORY"
  - $[[ inputs.setup ]]
  rules: $[[ inputs.rules ]]
  stage: $[[ inputs.stage ]]
  dependencies: []
  script:
  - test -n "$COMPONENT_OUTPUT" && test ! -e "$CI_PROJECT_DIR/$COMPONENT_OUTPUT"
  - $[[ inputs.build-command ]]
  - $[[ inputs.check-command ]]
  artifacts:
    expire_in: 30 days
    paths:
    - $[[ inputs.output ]]/
