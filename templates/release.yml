spec:
  inputs:
    name:
      type: string
      description: Release job name.
      default: gitlab-release
    image:
      type: string
      description: Internal image containing a compatible glab CLI.
      default: $RELEASE_CI_IMAGE
    notes-file:
      type: string
      description: Existing markdown release notes file.
      default: CHANGELOG.md
    rules:
      type: array
      description: Protected tags only.
      default:
      - if: $CI_COMMIT_TAG && $CI_COMMIT_REF_PROTECTED == "true"
      - when: never
    runner-tags:
      type: array
      description: Runner tags.
      default: []
---
$[[ inputs.name ]]:
  stage: release
  image: $[[ inputs.image ]]
  tags: $[[ inputs.runner-tags ]]
  interruptible: false
  retry: 0
  dependencies: []
  rules: $[[ inputs.rules ]]
  script:
  - test -f "$COMPONENT_NOTES"
  variables:
    COMPONENT_NOTES: $[[ inputs.notes-file ]]
  release:
    tag_name: $CI_COMMIT_TAG
    name: Release $CI_COMMIT_TAG
    description: $[[ inputs.notes-file ]]
